name: SupernoteViewer
options:
  bundleIdPrefix: dev.schaefer
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    # Ad-hoc by default so any clone builds; install.sh and release.sh override this.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "8"

packages:
  SupernoteKit:
    path: SupernoteKit

  SwiftyDropbox:
    url: https://github.com/dropbox/SwiftyDropbox.git
    exactVersion: 10.2.4

targets:
  # Opens .note/.mark/.pdf in its own windows (thumbnails, live reload, measuring).
  SupernoteViewer:
    type: application
    platform: macOS
    sources: [Shared, Viewer]
    info:
      path: Viewer/Info.plist
      properties:
        CFBundleDisplayName: Supernote Viewer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: Supernote Notebook
            CFBundleTypeIconFile: SupernoteNote
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.schaefer.supernote.note]
          - CFBundleTypeName: Supernote PDF Annotations
            CFBundleTypeIconFile: SupernoteMark
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.schaefer.supernote.mark]
          # PDFs open here via Open With; Preview stays the default.
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        NSServices:
          - NSMenuItem:
              default: Measure in Supernote Viewer
            NSMessage: measureFiles
            NSPortName: Supernote Viewer
            NSRequiredContext: {}
            NSSendFileTypes:
              - dev.schaefer.supernote.note
              - dev.schaefer.supernote.mark
              - com.adobe.pdf
        UTExportedTypeDeclarations: &supernoteTypes
          - UTTypeIdentifier: dev.schaefer.supernote.note
            UTTypeDescription: Supernote Notebook
            UTTypeIconFile: SupernoteNote
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [note]
          - UTTypeIdentifier: dev.schaefer.supernote.mark
            UTTypeDescription: Supernote PDF Annotations
            UTTypeIconFile: SupernoteMark
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [mark]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schaefer.SupernoteViewer
        PRODUCT_NAME: Supernote Viewer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon  # Viewer/AppIcon.icon (Icon Composer)
    dependencies:
      - package: SupernoteKit
        product: SupernoteKit
      - target: QuickLookPreview
        embed: true
        codeSign: true

  # Renders .note/.mark to PDF and hands it to Preview.app.
  SupernotePreviewBridge:
    type: application
    platform: macOS
    sources: [Shared, Bridge]
    info:
      path: Bridge/Info.plist
      properties:
        CFBundleDisplayName: Supernote Preview Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        # No Dock icon: opening a file hands it straight to Preview.
        LSUIElement: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Supernote Notebook
            CFBundleTypeIconFile: SupernoteNote
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.schaefer.supernote.note]
          - CFBundleTypeName: Supernote PDF Annotations
            CFBundleTypeIconFile: SupernoteMark
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.schaefer.supernote.mark]
        # Supernote Viewer exports these types; importing keeps them defined without it.
        UTImportedTypeDeclarations: *supernoteTypes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schaefer.SupernotePreviewBridge
        PRODUCT_NAME: Supernote Preview Bridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon  # Bridge/AppIcon.icon (Icon Composer)
    dependencies:
      - package: SupernoteKit
        product: SupernoteKit
    # Debug builds open a .note/.mark passed as launch argument, freshly rendered. Tick it in
    # Edit Scheme → Run → Arguments (or add your own path) to test renderer changes in Preview.
    scheme:
      commandLineArguments:
        "\"$(PROJECT_DIR)/examples/Example Titles.note\"": false

  QuickLookPreview:
    type: app-extension
    platform: macOS
    sources: [QuickLookPreview]
    info:
      path: QuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: Supernote Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - dev.schaefer.supernote.note
              - dev.schaefer.supernote.mark
    entitlements:
      path: QuickLookPreview/QuickLookPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        # Lets the preview of X.pdf.mark read the sibling X.pdf.
        com.apple.security.temporary-exception.files.absolute-path.read-only: ["/"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schaefer.SupernoteViewer.QuickLookPreview
    dependencies:
      - package: SupernoteKit
        product: SupernoteKit

  SupernoteViewerIOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ViewerIOS
        excludes: [Configuration]
      - path: examples
        name: Examples
        type: folder
        buildPhase: resources
    configFiles:
      Debug: ViewerIOS/Configuration/Base.xcconfig
      Release: ViewerIOS/Configuration/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schaefer.SupernoteViewerIOS
        PRODUCT_NAME: SupernoteViewerIOS
        CURRENT_PROJECT_VERSION: "16"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: ViewerIOS/Info.plist
      properties:
        CFBundleDisplayName: Supernote Viewer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DropboxAppKey: $(DROPBOX_APP_KEY)
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["db-$(DROPBOX_APP_KEY)"]
        LSApplicationQueriesSchemes: [dbapi-8-emm, dbapi-2]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Supernote and PDF Documents
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [dev.schaefer.supernote.note, dev.schaefer.supernote.mark, com.adobe.pdf]
        UTExportedTypeDeclarations: *supernoteTypes
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        BGTaskSchedulerPermittedIdentifiers: ["dev.schaefer.SupernoteViewerIOS.sync.*"]
        # Only HTTPS through Apple's networking stack: exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: SupernoteKit
        product: SupernoteKit
      - package: SwiftyDropbox
        product: SwiftyDropbox
    scheme:
      testTargets: [SupernoteViewerIOSTests, SupernoteViewerIOSUITests]

  SupernoteViewerIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ViewerIOSTests
      - path: SupernoteKit/Tests/Fixtures/supernote-typescript
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: SupernoteViewerIOS

  SupernoteViewerIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources: [ViewerIOSUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: ""
        TEST_TARGET_NAME: SupernoteViewerIOS
    dependencies:
      - target: SupernoteViewerIOS
